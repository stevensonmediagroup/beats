<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Beats</title>
  <style>
    :root{color-scheme:dark;--bg:#111217;--panel:#1c1d24;--ink:#f5f5f7;--muted:#9496a1;--accent:#a8ff45;--line:#30323b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,sans-serif}.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}aside{padding:28px 20px;border-right:1px solid var(--line);background:#15161b}.brand{font-size:25px;font-weight:800;letter-spacing:-1px}.brand b{color:var(--accent)}nav{margin-top:38px;color:var(--muted)}nav div{padding:11px;border-radius:8px}.active{background:var(--panel);color:var(--ink)}main{padding:48px;max-width:1050px;width:100%}h1{font-size:35px;margin:0 0 8px}.sub{color:var(--muted);margin-bottom:32px}.search{display:flex;gap:10px;background:var(--panel);padding:10px;border:1px solid var(--line);border-radius:12px}.search input{flex:1;background:transparent;border:0;color:var(--ink);padding:11px;font-size:16px;outline:0}.search button,.add{background:var(--accent);color:#172000;border:0;border-radius:8px;padding:0 22px;font-weight:800;cursor:pointer}.search select{background:#272933;color:var(--ink);border:0;border-radius:8px;padding:10px}.section{margin-top:35px}.section h2{font-size:18px}.job,.result{display:grid;grid-template-columns:1fr 110px;gap:20px;padding:18px 4px;border-bottom:1px solid var(--line)}.result button{padding:9px}.query{overflow:hidden;text-overflow:ellipsis}.meta{color:var(--muted);margin-top:4px}.status{text-align:right;text-transform:capitalize}.queued{color:var(--muted)}.downloading{color:#55baff}.complete{color:var(--accent)}.failed{color:#ff6b70}.empty{padding:22px 0;color:var(--muted)}.output{color:var(--muted);font-size:12px;margin-top:7px;white-space:pre-wrap}@media(max-width:700px){.app{display:block}aside{border:0;padding:18px}nav{display:none}main{padding:28px 20px}.search{flex-direction:column}.search button{padding:13px}}
  </style>
</head>
<body><div class="app"><aside><div class="brand"><b>●</b> BEATS</div><nav><div class="active">Search + downloads</div><div>Beatport + Beatsource</div></nav></aside><main><h1>Find your music.</h1><div class="sub">Search the catalog, select what you want, and send it to your chosen folder.</div><form class="search" id="form"><input id="query" autocomplete="off" placeholder="Search tracks and releases, or paste a URL…"><select id="folder"></select><button>Search</button></form><section class="section" id="resultsSection" hidden><h2>Results</h2><div id="results"></div></section><section class="section"><h2>Download queue</h2><div id="jobs" class="empty">Nothing queued yet.</div></section></main></div><script>
const jobs=document.querySelector('#jobs'),results=document.querySelector('#results'),resultsSection=document.querySelector('#resultsSection'),form=document.querySelector('#form'),query=document.querySelector('#query'),folder=document.querySelector('#folder');
async function refresh(){const data=await fetch('/api/jobs').then(r=>r.json());jobs.className=data.length?'':'empty';jobs.innerHTML=data.length?data.map(j=>`<div class="job"><div><div class="query">${escapeHTML(j.query)}</div>${j.output?`<div class="output">${escapeHTML(j.output.slice(-500))}</div>`:''}</div><div class="status ${j.status}">${j.status}</div></div>`).join(''):'Nothing queued yet.'}
function escapeHTML(v){const d=document.createElement('div');d.textContent=v;return d.innerHTML}
async function add(value){await fetch('/api/jobs',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({query:value,folder:folder.value})});refresh()}
form.addEventListener('submit',async e=>{e.preventDefault();const value=query.value.trim();if(!value)return;if(/^https?:\/\//.test(value)){await add(value);query.value='';return}resultsSection.hidden=false;results.innerHTML='<div class="empty">Searching…</div>';const response=await fetch('/api/search?q='+encodeURIComponent(value));const data=await response.json();if(!response.ok){results.innerHTML=`<div class="failed">${escapeHTML(data.error||'Search failed')}</div>`;return}results.innerHTML=data.length?data.map((item,i)=>`<div class="result"><div><div>${escapeHTML(item.Name)}</div><div class="meta">${escapeHTML(item.Artist)} · ${item.Type}</div></div><button class="add" data-i="${i}">Add</button></div>`).join(''):'<div class="empty">No results.</div>';results.querySelectorAll('button').forEach(button=>button.onclick=()=>add(data[button.dataset.i].URL))});
fetch('/api/folders').then(r=>r.json()).then(data=>folder.innerHTML=data.map(name=>`<option>${escapeHTML(name)}</option>`));refresh();setInterval(refresh,2000);
</script></body></html>
